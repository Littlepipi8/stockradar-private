
name: Initialize StockRadar Alert History

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r stockradar_private/requirements.txt

      - name: Initialize alert history
        working-directory: stockradar_private
        env:
          STOCKRADAR_INITIALIZE_ALERTS: "1"
        run: python notify.py

      -      - name: Save alert history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stockradar_private/data/alert_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Initialize StockRadar alert history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
