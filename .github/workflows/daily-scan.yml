
name: Daily S&P 500 scan


on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 2-6'


permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r stockradar_private/requirements.txt

      - name: Run stock scanner
        working-directory: stockradar_private
    
        run: python scanner.py

      - name: Send Discord stock alerts
        working-directory: stockradar_private
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python notify.py

      - name: Save scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stockradar_private/data/

          if ! git diff --cached --quiet; then
            git commit -m "Update daily stock scan"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

